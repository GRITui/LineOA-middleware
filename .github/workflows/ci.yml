name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Swift/Vapor)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - run: swift build
      - run: swift test

  liff:
    name: LIFF (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/liff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/liff/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
